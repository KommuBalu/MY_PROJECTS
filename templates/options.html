<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Trail | Select a Project</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --sky-top:#0E2A4A;
  --sky-mid:#3E7C99;
  --sky-glow:#F3C77E;
  --mist:#CFE8E4;
  --mtn-far:#3A5568;
  --mtn-mid:#25384A;
  --forest-far:#16362A;
  --forest-near:#0B2019;
  --water:#1C4A52;
  --water-shine:#BFE9E4;
  --card-glass:rgba(20,45,42,0.35);
  --ink:#F4FAF8;
  --muted:#CBE0DA;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  overflow:hidden;
  color:var(--ink);
}

/* ============ SCENE ============ */
.scene{
  position:relative;
  width:100%;height:100vh;
  background:linear-gradient(180deg,
    var(--sky-top) 0%,
    #235075 32%,
    var(--sky-mid) 55%,
    #7FB6B0 72%,
    var(--mist) 84%
  );
  overflow:hidden;
}

/* sun/moon glow */
.sun{
  position:absolute;
  top:14%;left:50%;
  transform:translateX(-50%);
  width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #FFF4D6, var(--sky-glow) 55%, rgba(243,199,126,0) 75%);
  box-shadow:0 0 90px 40px rgba(243,199,126,0.35);
  animation:sun-pulse 6s ease-in-out infinite;
}
@keyframes sun-pulse{
  0%,100%{opacity:.92;transform:translateX(-50%) scale(1);}
  50%{opacity:1;transform:translateX(-50%) scale(1.04);}
}

/* stars, faint, upper sky only */
.stars{position:absolute;inset:0;opacity:.35;}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3.5s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.85;}}

/* clouds */
.cloud{
  position:absolute;
  background:rgba(255,255,255,0.8);
  border-radius:100px;
  filter:blur(1px);
  opacity:.85;
}
.cloud::before,.cloud::after{
  content:"";position:absolute;background:inherit;border-radius:100px;
}
.cloud-1{width:180px;height:46px;top:12%;left:-220px;animation:drift 46s linear infinite;}
.cloud-1::before{width:90px;height:70px;top:-38px;left:20px;}
.cloud-1::after{width:70px;height:55px;top:-26px;left:100px;}
.cloud-2{width:130px;height:34px;top:20%;left:-180px;animation:drift 60s linear infinite;animation-delay:-15s;opacity:.7;}
.cloud-2::before{width:64px;height:50px;top:-26px;left:14px;}
.cloud-2::after{width:50px;height:38px;top:-18px;left:70px;}
.cloud-3{width:220px;height:50px;top:8%;left:-260px;animation:drift 75s linear infinite;animation-delay:-40s;opacity:.6;}
.cloud-3::before{width:100px;height:78px;top:-42px;left:30px;}
.cloud-3::after{width:80px;height:60px;top:-30px;left:120px;}
@keyframes drift{
  from{transform:translateX(0);}
  to{transform:translateX(calc(100vw + 300px));}
}

/* mountains - layered for depth */
.mountains{position:absolute;left:0;right:0;bottom:26%;width:100%;}
.mtn-far{fill:var(--mtn-far);opacity:.75;}
.mtn-mid{fill:var(--mtn-mid);opacity:.9;}

/* forest silhouette */
.forest{position:absolute;left:0;right:0;bottom:20%;width:100%;}
.trees-far{fill:var(--forest-far);}
.trees-near{fill:var(--forest-near);}

/* water */
.water{
  position:absolute;left:0;right:0;bottom:0;height:22%;
  background:linear-gradient(180deg, var(--water) 0%, #123138 100%);
  overflow:hidden;
}
.water::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(191,233,228,0.18), transparent 40%);
}
.shimmer{
  position:absolute;top:0;left:-50%;width:200%;height:100%;
  background:repeating-linear-gradient(
    100deg,
    transparent 0px,
    transparent 40px,
    rgba(191,233,228,0.20) 42px,
    transparent 46px,
    transparent 90px
  );
  animation:shimmer-move 7s linear infinite;
}
@keyframes shimmer-move{
  from{transform:translateX(0);}
  to{transform:translateX(25%);}
}
.reflection{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:150px;height:100%;
  background:linear-gradient(180deg, rgba(255,235,190,0.5), rgba(255,235,190,0));
  filter:blur(3px);
  animation:reflect-flicker 4s ease-in-out infinite;
}
@keyframes reflect-flicker{
  0%,100%{opacity:.55;}
  50%{opacity:.85;}
}

/* floating pollen / mist particles */
.particle{
  position:absolute;bottom:20%;
  width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,0.55);
  animation:float-up linear infinite;
}
@keyframes float-up{
  0%{transform:translateY(0) translateX(0);opacity:0;}
  10%{opacity:.8;}
  90%{opacity:.5;}
  100%{transform:translateY(-70vh) translateX(30px);opacity:0;}
}

/* ============ CARD ============ */
.stage{
  position:relative;z-index:5;
  height:100%;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.card{
  width:100%;max-width:420px;
  background:var(--card-glass);
  border:1px solid rgba(255,255,255,0.25);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-radius:22px;
  padding:44px 36px 36px;
  text-align:center;
  box-shadow:0 30px 80px -20px rgba(6,20,18,0.55);
}
.card .eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px;
}
.card .eyebrow svg{width:14px;height:14px;}
.card h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:1.9rem;
  margin:0 0 8px;
  color:#fff;
  letter-spacing:.2px;
}
.card p.sub{
  color:var(--muted);
  font-size:.92rem;
  margin:0 0 30px;
}

.select-wrap{position:relative;text-align:left;}
.select-wrap svg.leaf{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--sky-glow);pointer-events:none;
}
select{
  appearance:none;-webkit-appearance:none;
  width:100%;
  background:rgba(255,255,255,0.08);
  border:1.5px solid rgba(255,255,255,0.28);
  color:#fff;
  font-family:'Inter',sans-serif;
  font-size:1rem;font-weight:500;
  padding:16px 44px 16px 46px;
  border-radius:14px;
  cursor:pointer;
  transition:.3s ease;
}
select:hover{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.5);}
select:focus{
  outline:none;
  border-color:var(--sky-glow);
  box-shadow:0 0 0 4px rgba(243,199,126,0.25);
}
select option{
  background:#123138;
  color:#fff;
}
.select-wrap .chevron{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none;
  transition:.3s ease;
}
.select-wrap:focus-within .chevron{color:var(--sky-glow);}

.hint{
  margin-top:18px;font-size:.78rem;color:var(--muted);opacity:.75;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;}
}

@media (max-width:520px){
  .card{padding:34px 24px 28px;border-radius:18px;}
  .card h1{font-size:1.55rem;}
  .sun{width:110px;height:110px;top:10%;}
}
</style>
</head>
<body>

<div class="scene">

  <div class="sun"></div>
  <div class="stars" id="stars"></div>

  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>

  <svg class="mountains" viewBox="0 0 1200 260" preserveAspectRatio="none">
    <polygon class="mtn-far" points="0,260 0,150 160,60 320,150 480,40 650,140 820,55 1000,150 1200,90 1200,260"/>
    <polygon class="mtn-mid" points="0,260 0,190 200,110 400,190 620,95 850,180 1050,120 1200,180 1200,260"/>
  </svg>

  <svg class="forest" viewBox="0 0 1200 180" preserveAspectRatio="none">
    <g class="trees-far">
      <polygon points="40,180 70,110 100,180"/>
      <polygon points="120,180 150,95 180,180"/>
      <polygon points="230,180 260,120 290,180"/>
      <polygon points="330,180 360,100 390,180"/>
      <polygon points="470,180 500,115 530,180"/>
      <polygon points="600,180 630,105 660,180"/>
      <polygon points="720,180 750,120 780,180"/>
      <polygon points="850,180 880,100 910,180"/>
      <polygon points="960,180 990,118 1020,180"/>
      <polygon points="1080,180 1110,102 1140,180"/>
    </g>
    <g class="trees-near">
      <polygon points="0,180 45,70 90,180"/>
      <polygon points="90,180 150,55 210,180"/>
      <polygon points="190,180 250,80 310,180"/>
      <polygon points="340,180 400,60 460,180"/>
      <polygon points="440,180 505,90 570,180"/>
      <polygon points="650,180 710,65 770,180"/>
      <polygon points="750,180 815,85 880,180"/>
      <polygon points="900,180 965,60 1030,180"/>
      <polygon points="1000,180 1065,90 1130,180"/>
      <polygon points="1130,180 1200,70 1200,180"/>
    </g>
  </svg>

  <div class="water">
    <div class="reflection"></div>
    <div class="shimmer"></div>
  </div>

  <div id="particles"></div>

  <div class="stage">
    <div class="card">
      <span class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>
        Base Camp
      </span>
      <h1>Select a Project</h1>
      <p class="sub">Choose a trail to follow into your workspace.</p>

      <div class="select-wrap">
        <svg class="leaf" viewBox="0 0 24 24" fill="currentColor"><path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17 1.62.36 3.36-.13 4.17-1.18 7.31-4.85 8.19-9.14C18.16 8.87 20 4 20 4s-4.5-1.5-8.5 0-6 5.5-6 5.5c1-3.5 3.5-6 8-6.5C15.5 2 20 4 20 4s-2 4-3 4z"/></svg>
        <select onchange="goToProject(this.value)">
          <option value="">— Choose a project —</option>
          <option value="/weather">Weather App</option>
          <option value="/student">Student Management</option>
          <option value="/saiveera">Sai Veerabhadra Electronics</option>
          <option value="/login">True Caffeine</option>
          <option value="/Aboutme">Aboutme</option>
        </select>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>

      <p class="hint">You'll be taken straight to the project once selected.</p>
    </div>
  </div>

</div>

<script>
function goToProject(page) {
    if (page !== "") {
        window.location.href = page;
    }
}

// scatter faint stars in the upper sky
const starsWrap = document.getElementById('stars');
for (let i = 0; i < 40; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 30 + '%';
  s.style.animationDelay = (Math.random() * 3.5) + 's';
  starsWrap.appendChild(s);
}

// floating particles drifting up from the treeline
const particlesWrap = document.getElementById('particles');
for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDuration = (10 + Math.random() * 10) + 's';
  p.style.animationDelay = (Math.random() * 10) + 's';
  particlesWrap.appendChild(p);
}
</script>
</body>
</html>
