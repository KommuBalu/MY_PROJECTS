<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawan Projects — Welcome</title>
<meta name="description" content="Welcome page for Pawan Projects featuring an animated racing-inspired background.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* ==========================================================================
   PAWAN PROJECTS — welcome page
   Pure HTML5 + CSS3. No JS, no frameworks.
   ========================================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --asphalt-dark: #0A0A0D;
    --asphalt: #16161C;
    --steel: #2A2B33;
    --racing-red: #E10600;
    --amber: #FF9E1B;
    --chrome: #C9CDD3;
    --white: #FFFFFF;
}

html, body {
    height: 100%;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--asphalt-dark);
    color: var(--white);
    overflow-x: hidden;
    min-height: 100vh;
}

button {
    font-family: inherit;
    cursor: pointer;
}

/* ==========================================================================
   1. BACKGROUND SCENE — road, speed lines, moving cars
   ========================================================================== */

.scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 0%, #232430 0%, var(--asphalt) 45%, var(--asphalt-dark) 100%);
}

/* Ambient glow behind headline */
.glow {
    position: absolute;
    top: 30%;
    left: 50%;
    width: 900px;
    height: 900px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(225, 6, 0, 0.16), transparent 65%);
    filter: blur(10px);
}

/* ---------- Speed streak lines ---------- */
.speed-lines {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    opacity: 0.35;
}

.speed-line {
    height: 2px;
    width: 60%;
    background: linear-gradient(90deg, transparent, var(--chrome), transparent);
    animation: streak linear infinite;
}

.speed-line:nth-child(odd) { animation-duration: 3.2s; }
.speed-line:nth-child(even) { animation-duration: 4.6s; }
.speed-line:nth-child(3n) { animation-duration: 2.4s; opacity: 0.6; }

@keyframes streak {
    0%   { transform: translateX(-120%); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateX(220%); opacity: 0; }
}

/* ---------- Road at the bottom ---------- */
.road {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 34vh;
    background: linear-gradient(180deg, transparent, var(--asphalt) 25%, #08080a 100%);
    border-top: 2px solid rgba(255, 255, 255, 0.06);
}

.lane-markings {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 14vh;
    height: 6px;
    display: flex;
    gap: 40px;
    animation: laneScroll 1.1s linear infinite;
}

.lane-markings span {
    flex: 0 0 90px;
    height: 100%;
    background: var(--amber);
    opacity: 0.55;
    border-radius: 2px;
}

@keyframes laneScroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-130px); }
}

/* ---------- Cars ---------- */
.car-lane {
    position: absolute;
    left: 0;
    width: 100%;
}

.car-lane--1 { bottom: 20vh; }
.car-lane--2 { bottom: 9vh; }
.car-lane--3 { bottom: 2vh; }

.car {
    position: absolute;
    width: 180px;
    filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.55));
}

.car--red   { fill: var(--racing-red); }
.car--chrome{ fill: var(--chrome); }
.car--amber { fill: var(--amber); }

.car-lane--1 .car {
    width: 150px;
    animation: driveRight 9s linear infinite;
    opacity: 0.9;
}

.car-lane--2 .car {
    width: 200px;
    animation: driveLeft 7s linear infinite;
}

.car-lane--3 .car {
    width: 230px;
    animation: driveRight 5.5s linear infinite;
}

@keyframes driveRight {
    from { transform: translateX(-30%) scaleX(1); }
    to   { transform: translateX(120vw) scaleX(1); }
}

@keyframes driveLeft {
    from { transform: translateX(120vw) scaleX(-1); }
    to   { transform: translateX(-30%) scaleX(-1); }
}

/* Stagger each car's start so the lanes don't feel identical */
.car-lane--1 .car { animation-delay: 0s; }
.car-lane--2 .car { animation-delay: 1.8s; }
.car-lane--3 .car { animation-delay: 3.4s; }

/* ---------- Fine asphalt texture (subtle noise via gradients) ---------- */
.road::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        repeating-linear-gradient(120deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 6px);
    pointer-events: none;
}

/* ==========================================================================
   2. PAGE LAYOUT / CONTENT
   ========================================================================== */

.page {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.brand-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--racing-red);
    box-shadow: 0 0 14px 3px rgba(225, 6, 0, 0.8);
}

.nav-links {
    display: flex;
    gap: 28px;
    list-style: none;
}

.nav-links a {
    color: var(--chrome);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.4px;
    transition: color 0.2s ease;
}

.nav-links a:hover {
    color: var(--white);
}

/* ---------- Hero ---------- */
.hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 0 40px;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--amber);
    background: rgba(255, 158, 27, 0.08);
    border: 1px solid rgba(255, 158, 27, 0.3);
    padding: 8px 16px;
    border-radius: 999px;
    margin-bottom: 26px;
}

h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(40px, 8vw, 86px);
    line-height: 1.02;
    letter-spacing: 1px;
}

h1 .accent {
    color: var(--racing-red);
    text-shadow: 0 0 40px rgba(225, 6, 0, 0.55);
}

.subtitle {
    margin-top: 22px;
    max-width: 560px;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.7;
    color: var(--chrome);
}

.cta-row {
    display: flex;
    gap: 16px;
    margin-top: 40px;
}

.btn {
    padding: 15px 32px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    border: none;
    transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.2s ease;
}

.btn {
    display: inline-block;
    text-decoration: none;
    text-align: center;
    padding: 15px 32px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    border: none;
    transition: transform 0.2s ease, box-shadow 0.3s ease, background 0.2s ease;
}

.btn-primary {
    background: var(--racing-red);
    color: var(--white);
    box-shadow: 0 0 0 rgba(225, 6, 0, 0);
}

.btn-primary:hover {
    box-shadow: 0 0 30px 4px rgba(225, 6, 0, 0.5);
    transform: translateY(-2px);
}

.btn-ghost {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: var(--white);
    backdrop-filter: blur(6px);
}

.btn-ghost:hover {
    background: rgba(255, 255, 255, 0.14);
    transform: translateY(-2px);
}

/* ---------- Stats strip ---------- */
.stats {
    display: flex;
    justify-content: center;
    gap: 56px;
    margin-top: 64px;
    padding-bottom: 40px;
}

.stat {
    text-align: center;
}

.stat-num {
    font-family: 'Oswald', sans-serif;
    font-size: 30px;
    font-weight: 600;
    color: var(--white);
}

.stat-label {
    margin-top: 4px;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--chrome);
    opacity: 0.75;
}

/* ==========================================================================
   3. RESPONSIVE
   ========================================================================== */

@media (max-width: 768px) {
    .nav-links { display: none; }
    .stats { gap: 32px; }
    .car { display: none; }
    .car-lane--2 .car:first-child,
    .car-lane--3 .car:first-child { display: block; width: 130px; }
}

@media (max-width: 480px) {
    .page { padding: 24px 18px 0; }
    h1 { font-size: 34px; }
    .subtitle { font-size: 14px; }
    .cta-row { flex-direction: column; width: 100%; }
    .btn { width: 100%; text-align: center; }
    .stats { flex-wrap: wrap; gap: 24px; }
}

@media (prefers-reduced-motion: reduce) {
    .car, .speed-line, .lane-markings {
        animation: none !important;
    }
}
</style>
</head>
